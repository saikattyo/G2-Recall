<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G2 Recall</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #121515; color: #f1f5f2; }
      #phone-controller { box-sizing: border-box; max-width: 620px; margin: 0 auto; padding: 24px 18px 36px; }
      .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      .brand h1 { margin: 0; font-size: 26px; }
      .brand p { margin: 0; color: #9ea9a4; font-size: 13px; }
      .language-picker { display: flex; align-items: center; gap: 8px; color: #aeb9b3; font-size: 13px; }
      .language-picker select { width: auto; min-height: 36px; padding: 6px 28px 6px 9px; }
      .panel { border: 1px solid #2d3733; background: #1a201e; border-radius: 10px; padding: 16px; margin-top: 14px; }
      .panel h2 { margin: 0 0 10px; font-size: 17px; }
      .panel p { color: #aeb9b3; line-height: 1.45; margin: 8px 0 14px; }
      label, input, select, button { font: inherit; }
      input[type="file"] { width: 100%; box-sizing: border-box; padding: 12px 0; color: #cbd4cf; }
      input[type="text"] { width: 100%; box-sizing: border-box; min-height: 44px; border: 1px solid #3d4b45; border-radius: 7px; background: #25312c; color: #f1f5f2; padding: 10px 12px; }
      select, button { width: 100%; min-height: 44px; border: 1px solid #3d4b45; border-radius: 7px; background: #25312c; color: #f1f5f2; padding: 10px 12px; }
      button { margin-top: 12px; background: #8be28b; color: #102014; border-color: #8be28b; font-weight: 700; }
      button.secondary { background: #25312c; color: #f1f5f2; border-color: #3d4b45; }
      button:disabled { opacity: .45; }
      #phone-status { min-height: 20px; color: #aeb9b3; font-size: 13px; }
      .hint { font-size: 12px; }
      .field-label { display: block; margin: 14px 0 7px; color: #cbd4cf; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="phone-controller" aria-label="G2 Recall phone controls">
      <div class="brand">
        <h1>G2 Recall</h1>
        <label class="language-picker" for="language-select">
          <span id="language-label">言語</span>
          <select id="language-select" aria-label="言語">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <section class="panel">
        <h2 id="file-panel-title">ファイルを読み込む</h2>
        <p id="file-panel-description">スマホからAnkiの.apkgファイルを追加できます。対応形式: .apkgのみ</p>
        <label class="field-label" id="file-label" for="deck-file">ファイルを選択</label>
        <input id="deck-file" type="file" accept=".apkg" />
        <p id="phone-status" role="status">読み込み待機中</p>
        <div id="title-editor" hidden>
          <label class="field-label" id="title-label" for="deck-title">デッキの表示名</label>
          <input id="deck-title" type="text" maxlength="80" />
          <button id="save-title" class="secondary" type="button">タイトルを保存</button>
        </div>
      </section>
      <section class="panel">
        <h2 id="scope-panel-title">復習する範囲</h2>
        <select id="scope-select" aria-label="復習する範囲" disabled>
          <option>読み込み中…</option>
        </select>
        <button id="start-review" type="button" disabled>この範囲をG2で復習</button>
        <p id="scope-hint" class="hint">G2ではスワイプで選択、タップで決定します。</p>
      </section>
    </main>
    <script src="/vendor/fflate.umd.js"></script>
    <script src="/vendor/sql-wasm.js"></script>
    <script src="/apkg.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
